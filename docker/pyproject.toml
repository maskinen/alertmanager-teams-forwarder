[project]
name = "alertmanager-teams-forwarder"
version = "0.1.0"
description = "Forwards monitoring alerts to a chat platform through an automation flow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn>=0.42.0",
    "httpx>=0.28.0",
    "elasticsearch>=8.0.0,<9.0.0",
    "aiohttp>=3.9.0",
]

[dependency-groups]
dev = [
    "pip>=26.0.1",
]